<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE4-B</title>
    <style>
        body {
            overflow-y: hidden;
            overflow-x: hidden;
            margin: 0;
        }

        .container {
            display: grid;
            width: 100vw;
            height: 100vh;

            grid-template-areas: 
                "box1 box1 box1 box1"
                "box2 box3 box3 box4"
                "box5 box3 box3 box6"
                "box5 box7 box7 box7";
        }

        .box {
            border-radius: 30px;
            margin: 1.7%;
            
            display: flex;
            justify-content: center; 
            align-items: center;     
            
            font-size: 2rem;
            font-weight: bold;
            color: black;
        }
        #box3 {
            background-color: rgb(28, 230, 45);
            grid-area: box3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="box1" class="box"></div>
        <div id="box2" class="box"></div>
        <div id="box3" class="box"></div>
        <div id="box4" class="box"></div>
        <div id="box5" class="box"></div>
        <div id="box6" class="box"></div>
        <div id="box7" class="box"></div>
    </div>
    
</body>
</html>

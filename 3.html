<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE3</title>
    <style>  
        .bandeira{
            width: 300px;
            height: 180px;
            margin: 40px auto;
            border: 1px solid #333;
            position: relative;
        }

        #japao.bandeira{
            background-color: white;
        }

        #japao.bandeira > div.circulo{
            width: 90px;
            height: 90px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #alemanha.bandeira{
            background: linear-gradient(to bottom, black 33.33%, red 33.33% 66.66%, yellow 66.66%);
        }


        #franca.bandeira{
            background: linear-gradient(to right, rgb(1, 22, 212) 33.33%, white 33.33% 66.66%, red 66.66%);
        }


   


    </style>
</head>
<body>

    

    <div id="franca" class="bandeira"></div>

    <div id="alemanha" class="bandeira"></div>

    <div id="japao" class="bandeira">
        <div class="circulo"></div>
    </div>

</body>
</html>

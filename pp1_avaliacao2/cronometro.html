<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cronometro</title>
</head>
<style>

    body{

        display: flex; 

        justify-content: center; 

        align-items: center; 

        height: 100vh; 

        margin: 0; 
        background-color: bisque;

    }

    .divPrincipal{
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 1300px;
        height: 700px;
        background-color: bisque;
    }

    .cronometro{
        display: grid;
        grid-template-rows: 1fr;
        padding: 30px;
        background-color: gray;
        width: 800px; 
        border-top-left-radius: 10px; 
        border-bottom-left-radius: 10px;
        
    }
 

    .tempo{
        font-size: 6rem;
        text-align: center;
        margin-top: 150px;
        color: white;
    }

    .botoes{
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 250px;
    }

    .botoes button{
        background-color: white;
        border: 0;
        border-radius: 4px;
        height: 50px;
        width: 100px;
        cursor: pointer;
    }

     .botoes button:hover{
        background-color: gainsboro;
    }

    .botoes button:active{
        background-color: rgb(53, 247, 150);
    }

    .paradas{
        background-color: gainsboro;
        border-top-right-radius: 10px;
        border-bottom-right-radius: 10px;
        padding: 30px;
    }
    
    .paradas h2{
        margin-top: 0;
        text-align: center;
    }

    .lista-paradas{
        margin-top: 20px;
        font-size: 1.3rem;
    }

</style>
<body>
    <div class="divPrincipal">
        <div class="cronometro">
            <div class="tempo">00:00:00</div>

            <div class="botoes">
                <button class="piniciar">Iniciar</button>
                <button class="ppausar">Pausar</button>
                <button class="ppara">Parar</button>
            </div>


        </div>
        <div class="paradas">
            <h2>⏸ Pausas Registradas</h2>
            <div class="lista-paradas" id="listaPausas">
                <!-- pausas -->
            </div>
        </div>
</body>
<script>

    const tempoDisplay = document.querySelector(".tempo");

    const BotaoIniciar = document.querySelector(".piniciar");
    const BotaoPausar  = document.querySelector(".ppausar");
    const BotaoParar   = document.querySelector(".ppara");

    const listaPausas = document.getElementById("listaPausas");

    let interval = null;
    let inicio = null;         
    let pausado = 0;           
    let rodando = false;


    function iniciar() {
        if (rodando) return;  

        rodando = true;
        inicio = Date.now() - pausado;  

        interval = setInterval(() => {
            atualizarTempo();
        }, 100);
    }

    
    function pausar() {
        if (!rodando) return;

        rodando = false;
        clearInterval(interval);

        pausado = Date.now() - inicio;

        registrarPausa(formatar(pausado));
    }

    
    function parar() {
        rodando = false;
        clearInterval(interval);

        inicio = null;
        pausado = 0;

        tempoDisplay.textContent = "00:00:00";
        listaPausas.innerHTML = ""; 
    }

    
    function atualizarTempo() {
        const agora = Date.now();
        const diff = agora - inicio;

        tempoDisplay.textContent = formatar(diff);
    }

    
    function formatar(ms) {
        let totalSegundos = Math.floor(ms / 1000);

        const horas = Math.floor(totalSegundos / 3600);

        totalSegundos %= 3600;

        const minutos = Math.floor(totalSegundos / 60);

        const segundos = totalSegundos % 60;

        return (
            String(horas).padStart(2, "0") + ":" +
            String(minutos).padStart(2, "0") + ":" +
            String(segundos).padStart(2, "0")
        );
    }

    
    function registrarPausa(textoTempo) {
        const item = document.createElement("div");
        item.textContent = "Pausa:" + textoTempo;
        listaPausas.appendChild(item);
    }

    
    document.addEventListener("keydown", (e) => {
        const tecla = e.key.toLowerCase(); 

        if (tecla === "s") iniciar();   
        if (tecla === "p") pausar();    
        if (tecla === "t") parar();     
    });

    
    BotaoIniciar.addEventListener("click", iniciar);
    BotaoPausar.addEventListener("click", pausar);
    BotaoParar.addEventListener("click", parar);

</script>
</html>

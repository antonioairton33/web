<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
</head>
<style>
    body{
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0;
        background-color: bisque;

    }

    .divDacalculadora{
        display: grid; 
        grid-template-rows: 100px auto; 
        width: 300px; 
        border-radius: 10px;
        background-color: rgb(255, 255, 255); 

    }

    .divDatela{
        display: flex; 
        justify-content: flex-end; 
        align-items: center; 
        padding: 0px 20px 0px 20px; 
        background-color: gray; 
        color: white; 
        font-size: 2em; 
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .divDosbotoes{
        display: grid;
        grid-template-columns: repeat(4, 1fr); 
        gap: 10px; 
        padding: 10px; 
    }

    .divDosbotoes button{
        font-size: 1.5em; 
        padding: 20px; 
        border: none; 
        border-radius: 5px;
        cursor: pointer; 
        background-color: gainsboro; 
    }

    .divDosbotoes button:hover{
        background-color: cadetblue;
    }
    .divDosbotoes button:active{
        background-color: rgb(84, 126, 128);
    }

    #botaoIgual{
        grid-row: span 4; 
        background-color: #80ef80;
        color: white;
    }

</style>
<body>
    <div class="divDacalculadora">

        <div class="divDatela">0</div>

        <div class="divDosbotoes">
            <button>+</button>
            <button>-</button>
            <button>x</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button id="botaoIgual">=</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <!--<button>=</button>-->

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <!--<button>=</button>-->

            <button>.</button>
            <button>0</button>
            <button>C</button>
            <!--<button>=</button>-->
        </div>



    </div>
</body>
<script>
   
    const tela = document.querySelector(".divDatela");
    
    
    const botoes = document.querySelectorAll(".divDosbotoes button")

   
    let expressao = "";
    
    function validarExpressao(expr) {

        if (!/^[0-9+\-*/.]+$/.test(expr)) return false;
        
        return true;
    }

    botoes.forEach(botao => { 
        botao.addEventListener("click", () => {
    
            console.log(botao.textContent); 

            const valor = botao.textContent; 
            if(valor === "C"){

                expressao = '';
                tela.textContent = '0';
            } else if(valor === "="){

                
                if (!validarExpressao(expressao)) {
                    tela.textContent = "Inválido";
                    expressao = '';
                    return;
                }

                try{
                    //obs explicar isso
                    tela.textContent = expressao = eval(expressao);
                    
                } catch { 
                    tela.textContent = "Erro";
                    expressao = '';
                    
                }
            } else {
                let valorFinal = valor;
                if(valor === "x"){
                    valorFinal = "*";

                } else if(valor === "÷"){
                    valorFinal = "/";
                }
                
                expressao += valorFinal;
                
                let expressaoVisivel = expressao
                    .replace (/\*/g, "x")
                    .replace (/\//g, "÷")
                tela.textContent = expressaoVisivel
            }
        });
    });



</script>
</html>

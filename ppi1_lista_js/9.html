<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
</head>
<style>
    body{
        display: flex; /* transforma em container flexivel e permite alterar a posicao do unico filho do body que é calculadora apenas horizontal*/

        justify-content: center; /* centraliza a calculadora horizontalmente*/

        align-items: center; /* centraliza a calculadora verticalmente */

        height: 100vh; /* ocupar toda a tela para permiter a calculadora ficar no meio*/

        margin: 0; /* remove os espaçmentos */
        background-color: bisque;

    }

    .divDacalculadora{
        display: grid; /* transforma em um container grid  mais personalizavel por linhas e colunas*/
        grid-template-rows: 100px auto; /* define duas linhas, display 100px e linha dos botões automatico*/

        width: 350px; /*largura da calculadora*/
        height: 700px;
        border-radius: 10px; /* borda arredondadas */

        background-color: rgb(189, 189, 189); /* cor de fundo */

    }

    .divDatela{
        display: flex; /* permite alinhar o numero facilmento horizontal*/
        justify-content: flex-end; /* alinha o numero ao final (direita)*/
        align-items: center; /* centraliza veticalmente */
        padding: 0px 20px 0px 20px; /* espao interno nas laterias */
        background-color: rgb(207, 240, 241); /* cor do fundo */
        color: rgb(0, 0, 0); /* cor do numero */
        font-size: 2em; /* numero grande e visível */
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .divDosbotoes{
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* cada coluna tem a mesma largura 1fr fraçao do espaco disponivel */
        gap: 10px; /* espaco entre os botoes */
        padding: 10px; /* organiza o botoes em relaçoes a borda da calculadora */
    }

    .divDosbotoes button{
        font-size: 1.5em; /* relativo ao elemento pai mudar fonte do botao */
        padding: 20px; 
        border: none; 
        border-radius: 5px;
        cursor: pointer; /* muda o curso ao passar em cima */
        background-color: rgb(253, 220, 237); 
    }

    .divDosbotoes button:hover{
        background-color: rgb(255, 255, 255);
    }

    #botaoIgual{
        grid-row: span 4; /* ocupa 4 linhas do grid */
        background-color: #ef8080;
        color: white;
    }

</style>
<body>
    <div class="divDacalculadora">

        <div class="divDatela">0</div>

        <div class="divDosbotoes">
            <button>+</button>
            <button>-</button>
            <button>x</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button id="botaoIgual">=</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <!--<button>=</button>-->

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <!--<button>=</button>-->

            <button>.</button>
            <button>0</button>
            <button>C</button>
            <!--<button>=</button>-->
        </div>



    </div>
</body>
<script>
    //seleciona a tela pela declarada pela const que não muda referencia e pega o primeiro elemento por isso nao precisa do query selectorall.
    const tela = document.querySelector(".divDatela");
    
    //seleciona todos os botões e novamente utiliza const para nao mudar refeerencia e pega todos os elementos que combinam e retorna uma lista (NodeList) por isso utilizar o queryselectorall.
    const botoes = document.querySelectorAll(".divDosbotoes button")

    //variável para guardar a expressão tudo que o usuario apertar:
    let expressao = "";
    let resultadoAnterior = null; //guarda o resultado apos apertar o =
    let deveLimparTela = false; //indica se a tela precisar limpar ao iniciar nova operaçao

    botoes.forEach(botao => { //for each pecorre todos os botoes
        botao.addEventListener("click", () => {
            //decidindo oque fazer quando clicar
            console.log(botao.textContent); //teste para mostrar os botoes clicados

            const valor = botao.textContent; //coleta o texto do botao
            
            if(valor === "C"){
                //vai limpar a tela para recomeçar
                expressao = '';
                tela.textContent = '0';
            } else if(valor === "="){
                //calcula o resultado
                //try evita que o programa quebre se a expressao estiver 
                //try siginifica tente executar ese codigo
                try{
                    //eval  funcao pronta para expressao matematica
                    tela.textContent = eval(expressao); // 
                } catch { //catch significa "se acontecer algum erro, execute este outro codigo."
                    tela.textContent = "Erro";
                    expressao = '';
                    //isso permite que se houver algum erro a pagina limpe a expressao e possa recomeçar
                }
            } else {
                let valorFinal = valor;
                if(valor === "x"){
                    valorFinal = "*";

                } else if(valor === "÷"){
                    valorFinal = "/";
                }
                //adiocina o valor à expressão
                expressao += valorFinal;
                //mostra na tela o x tbm ao inves do * e ÷ por /
                let expressaoVisivel = expressao
                    .replace (/\*/g, "x")
                    .replace (/\//g, "÷")
                tela.textContent = expressaoVisivel
            }
        });
    });



</script>
</html>

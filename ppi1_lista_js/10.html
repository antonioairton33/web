<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atribuindo Eventos</title>
</head>
<style>
</style>
<body>
  <button id="alertButton">Clique aqui</button>
  <input type="text" id="textInput" placeholder="Digite algo">
  <div id="hoverDiv">Passe o mouse aqui</div>
  <select id="colorSelect">
    <option value="">Escolha uma cor</option>
    <option value="blue">Azul</option>
    <option value="green">Verde</option>
    <option value="red">Vermelho</option>
  </select>
</body>
<script>
    let botao = document.getElementById("alertButton")
    botao.addEventListener("click", () =>{
        alert("OLÁ, ISSO É UM ALERTA.")
    })


    let texto = document.getElementById("textInput");
    texto.addEventListener("keydown", (event)=>{
        console.log(event.key);
    })
    texto.addEventListener("focus", () => {
        texto.style.backgroundColor = "aqua";
    });
    texto.addEventListener("blur", () => {
        texto.style.backgroundColor = ""; 
    });


    let divhouver = document.getElementById("hoverDiv");
    divhouver.addEventListener("mouseover", () => {
        divhouver.style.backgroundColor = "red";
    });
    divhouver.addEventListener("mouseout", () => {
        divhouver.style.backgroundColor = "";
    });

    let seletor = document.getElementById("colorSelect");

    seletor.addEventListener("change", () => {
        document.body.style.backgroundColor = seletor.value;
    });
</script>
</html>

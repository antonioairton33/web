<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs Centralizadas</title>
    <style>
        body {
            display: flex;             
            justify-content: center;    
            align-items: center;      
            height: 100vh;             
            margin: 0;
        }

        div {
            width: 500px;
            height: 380px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="div-1"></div>
    <div id="div-2"></div>
    <div id="div-3"></div>
    <div id="div-4"></div>
    <div id="div-5"></div>

    <script>
        const divs = document.querySelectorAll("div");

        document.body.addEventListener("keydown", () => {
            if(event.code ==="Space"){
                divs.forEach((elemento) => {
                    const cor = `rgb(${randColor()}, ${randColor()}, ${randColor()})`;
                    elemento.style.backgroundColor = cor;
                });

            }  
        });

        function randColor() {
            return Math.floor(Math.random() * 256);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    <p>Nome:</p>
    <input type="text" id="nome">
    <br>
    <p>Peso:</p>
    <input type="number" id="peso" step="0.1">
    <br>
    <p>Altura:</p>
    <input type="number" id="altura" step="0.01">
    <br><br>
    
    <button onclick="Calculo()">Calcular</button>

    <p id="name"></p>
    <p id="imc"></p>
    <p id="Classificacao"></p>

    <img id="imgPessoa" src="" alt="">
</body>
<script>
    function Calculo(){
        let nome = document.getElementById("nome").value;
        let peso = parseFloat(document.getElementById("peso").value)
        let altura = parseFloat(document.getElementById("altura").value);

        if(nome === "" || isNaN(peso) || isNaN(altura)){
            alert("Preencha todos os campos!");
            return;
        }

        let imc = peso / (altura * altura);

        document.getElementById("name").innerText = nome + " Segue Suas informações:";
        document.getElementById("imc").innerText = "O IMC: " + imc.toFixed(2);

        if(imc < 18.5){
            
            document.getElementById("Classificacao").innerText = "Classificação: Abaixo do Peso";
        } else if(18.5 <= imc && imc < 24.9){
            document.getElementById("Classificacao").innerText = "Classificação: Peso Normal";
        } else if(25 <= imc && imc < 29.9){
            document.getElementById("Classificacao").innerText = "Classificação: Acima do Peso";
        } else if(30 <= imc && imc < 34.9){
            document.getElementById("Classificacao").innerText = "Classificação: Obesidade Grau 1" ;
        } else if(35 <= imc && imc < 39.9){
            document.getElementById("Classificacao").innerText = "Classificação: Obesidade Grau 2";
        } else if(imc >= 40){
            document.getElementById("Classificacao").innerText = "Classificação: Obesidade Grau 3";
        }

        let imagem = Math.floor(imc);

        switch (true){
            case (imc < 18):
                imgPessoa.src = "../imgs/i1.png"
                break;
            case (imc < 25):
                imgPessoa.src = "../imgs/i2.png"
                break;
            case (imc < 30):
                imgPessoa.src = "../imgs/i3.png"
                break;
            case (imc < 35):
                imgPessoa.src = "../imgs/i4.png"
                break;
            case (imc < 40):
                imgPessoa.src = "../imgs/i5.png"
                break;
            default:
                imgPessoa.src = "../imgs/i5.png"
        }
            
        


    }

</script>
</html>

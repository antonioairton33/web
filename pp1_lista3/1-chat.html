<!DOCTYPE html>
<html>
<head>
    <title>1chat</title>
    <link rel="stylesheet" href="1-chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="message">
            <div class="user-info">
                <img src="../imgs/avatarhomem.png" alt="User Avatar" class="avatar">
                <span class="username">Pedro Silva</span>
            </div>
            <div class="message-content">
                <p>Olá, tudo bem?</p>
            </div>
            <span class="time">00:50</span>
        </div>
        
        <div class="message user-message">
            <div class="user-info">
                <img src="../imgs/avatarmulher.png" alt="User Avatar" class="avatar">
                <span class="username">Eu</span>
            </div>
            <div class="message-content">
                <p>Estou bem sim, e você?</p>
            </div>
            <span class="time">00:55</span>
        </div>

        <div class="message">
            <div class="user-info">
                <img src="../imgs/avatarhomem.png" alt="User Avatar" class="avatar">
                <span class="username">Pedro Silva</span>
            </div>
            <div class="message-content">
                <p>Vamos sair hoje? sabe conversar...</p>
            </div>
            <span class="time">01:01</span>
        </div>

        <div class="message user-message">
            <div class="user-info">
                <img src="../imgs/avatarmulher.png" alt="User Avatar" class="avatar">
                <span class="username">Eu</span>
            </div>
            <div class="message-content">
                <p>Criatura ......</p>
            </div>
            <span class="time">00:53</span>
        </div>

        <div class="message-input">
            <input type="text" placeholder="Digite sua mensagem">
            <button>Enviar</button>
        </div>
    </div>
</body>
</html>
